<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diamond Seller</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b12;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:650px;margin:auto;padding:18px}
.card{background:#111824;border:1px solid #27344a;border-radius:18px;padding:20px;margin:15px 0}
h1{color:#ffd75e;text-align:center}
h2{color:#ffd75e}
input,select,button{width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input,select{background:#0b111b;color:#fff;border:1px solid #344258}
button{border:0;background:#ffd75e;color:#111;font-weight:bold}
.pkg{padding:13px;margin:7px 0;border:1px solid #344258;border-radius:10px;cursor:pointer}
.pkg.active{border-color:#ffd75e;background:#1b2230}
.pay{line-height:1.8}
#msg{text-align:center;font-weight:bold}
</style>
</head>

<body>
<div class="wrap">

<div class="card">
<h1>💎 DIAMOND SELLER</h1>
<p style="text-align:center">MLBB Diamond Top Up</p>
</div>

<div class="card">
<h2>🎮 Order</h2>

<input id="uid" placeholder="MLBB User ID">
<input id="zone" placeholder="Zone ID">

<h3>💎 Diamond Package</h3>
<div id="packages"></div>

<h3>💳 Payment Method</h3>
<select id="payment">
<option>KPay - 09672275860</option>
<option>WavePay - 09673807226</option>
<option>UAB Pay - 09683257717</option>
</select>

<div class="pay">
<b>Account Name:</b> Chan Myae Han
</div>

<h3>🧾 Payment Receipt</h3>
<input id="receipt" type="file" accept="image/*,.pdf">

<button onclick="sendOrder()">📩 Order တင်မယ်</button>

<p id="msg"></p>
</div>

</div>

<script>
const packages=[
["Weekly Pass",6600],
["Twilight Pass",35800],
["86 Diamonds",5500],
["172 Diamonds",10800],
["257 Diamonds",15800],
["343 Diamonds",21200],
["429 Diamonds",26600],
["514 Diamonds",31600],
["600 Diamonds",37000],
["706 Diamonds",42700],
["792 Diamonds",48200],
["878 Diamonds",53600],
["963 Diamonds",58500],
["1049 Diamonds",64000],
["1220 Diamonds",74300],
["1412 Diamonds",85400],
["1498 Diamonds",90900],
["1584 Diamonds",96300],
["2195 Diamonds",129000],
["3688 Diamonds",215500],
["2×50",3500],
["2×150",10400],
["2×250",16700],
["2×500",34300]
];

let selected=null;

packagesDiv=document.getElementById("packages");

packages.forEach((p,i)=>{
  let d=document.createElement("div");
  d.className="pkg";
  d.innerHTML=p[0]+" — "+p[1].toLocaleString()+" Ks";
  d.onclick=()=>{
    selected=p;
    document.querySelectorAll(".pkg").forEach(x=>x.classList.remove("active"));
    d.classList.add("active");
  };
  packagesDiv.appendChild(d);
});

async function sendOrder(){

  const uid=document.getElementById("uid").value.trim();
  const zone=document.getElementById("zone").value.trim();
  const payment=document.getElementById("payment").value;
  const receipt=document.getElementById("receipt").files[0];
  const msg=document.getElementById("msg");

  if(!uid||!zone){
    msg.textContent="❌ User ID နဲ့ Zone ID ထည့်ပါ";
    return;
  }

  if(!selected){
    msg.textContent="❌ Diamond Package ရွေးပါ";
    return;
  }

  if(!receipt){
    msg.textContent="❌ Payment Receipt တင်ပါ";
    return;
  }

  const form=new FormData();

  form.append("userId",uid);
  form.append("zoneId",zone);
  form.append("package",selected[0]);
  form.append("price",selected[1]);
  form.append("payment",payment);
  form.append("receipt",receipt);

  msg.textContent="⏳ Telegram သို့ ပို့နေပါသည်...";

  try{

    const r=await fetch("/api/submit-order",{
      method:"POST",
      body:form
    });

    const data=await r.json();

    if(data.ok){
      msg.textContent="✅ Order နှင့် Receipt Telegram သို့ ရောက်ပါပြီ";
    }else{
      msg.textContent="❌ "+data.message;
    }

  }catch(e){
    msg.textContent="❌ Server မချိတ်ထားသေးပါ";
  }
}
</script>

</body>
</html>
